<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + interactive-widget: proper safe-area behaviour
         behind the Android status bar / gesture bar, keyboard respects dvh -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d9488" />
    <link rel="icon" type="image/png" sizes="512x512" href="./favicon.png" />
    <!-- 'wasm-unsafe-eval' powers sql.js (SQLite WASM) inside the WebView -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; media-src 'self' data: blob:;" />
    <title>MMS — Minz Mahallu Management System</title>
    <style>
      .tbl th { font-size: 13.5px; }
      /* Boot splash background matches the app splash to avoid a white flash */
      html, body { background: #0b1220; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
