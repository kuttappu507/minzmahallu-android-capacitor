name: Build Electron App

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            artifact_name: MMS-React-Windows
          - os: ubuntu-latest
            target: linux
            artifact_name: MMS-React-Linux
          - os: macos-latest
            target: mac
            artifact_name: MMS-React-macOS

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libnotify-dev libnss3-dev libxss1 libxtst-dev xdg-utils libatspi2.0-0 libdrm2 libgbm1 libsecret-1-dev
        shell: bash

      - name: Install npm packages
        run: npm install --no-audit --no-fund

      - name: Run hardcoded English audit
        run: |
          node scripts/i18n-audit.mjs > hardcoded-english-audit.txt
          cat hardcoded-english-audit.txt

      - name: Upload hardcoded English audit
        uses: actions/upload-artifact@v4
        with:
          name: hardcoded-english-audit-${{ matrix.target }}
          path: hardcoded-english-audit.txt
          if-no-files-found: error

      - name: Rebuild native modules for Electron
        run: npx electron-builder install-app-deps

      - name: Build renderer + electron main
        run: npm run build

      - name: Package app (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux AppImage --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package app (Windows — NSIS installer + portable)
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis portable --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_LINK: ""
          CSC_KEY_PASSWORD: ""

      - name: Package app (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac dmg --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-installers
          path: |
            release/*.exe
            release/*.AppImage
            release/*.dmg
          if-no-files-found: warn

      - name: List release folder (debug)
        if: always()
        shell: bash
        run: |
          echo "=== release/ contents ==="
          if [ -d release ]; then
            ls -lh release/ || true
            echo ""
            echo "=== release/ files ==="
            find release/ -maxdepth 3 -type f -print | head -50 || true
          else
            echo "release/ does not exist (build/package may have failed above)"
          fi

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: MMS-React-*-installers
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}