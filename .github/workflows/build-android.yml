name: Build Android APK

# Builds the signed, installable MMS Mahallu Android APK on every push.
# This repo is the ANDROID port — desktop/Electron builds live in
# kuttappu507/minzmahallu-electron and are NOT built here.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest runners ship a full Android SDK at $ANDROID_HOME.
      # Accept licenses and make sure compileSdk 36 / build-tools 36 are
      # present (Gradle could auto-fetch them, this just makes it explicit).
      - name: Ensure Android SDK components
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install npm dependencies
        run: npm ci

      - name: Build web app and sync into Android project
        run: npm run mobile:sync

      - name: Build release APK (signed with mms-release.keystore)
        run: cd android && bash ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p apk-out
          cp android/app/build/outputs/apk/release/app-release.apk \
             "apk-out/MMS-Mahallu-v3.0.0-300-capacitor.apk"
          ls -lh apk-out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MMS-Mahallu-Android-APK
          path: apk-out/*.apk
          if-no-files-found: error

      # Tag pushes (v*) -> real release. Main pushes -> rolling "latest-apk"
      # pre-release so a fresh installable APK is always one click away.
      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest-apk' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Latest Android APK (main)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: apk-out/*.apk
          make_latest: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
